; Alpine Faction VR - WinlatorXR tuning. Changes are picked up within a second
; while the game runs. Delete a line (or the file) to go back to the default.
;
; eye_height=0          ; eye render height in pixels, 0 = screen height
; fov_scale=1.0         ; render/declared FOV multiplier (0.5 - 1.5)
; hud_distance_m=2.4    ; head-locked HUD distance
; hud_width_m=5.0       ; HUD size (width of the whole HUD image, meters)
; hud_crop=0.22         ; part of each HUD side shown (0.5 = whole HUD)
; hud_gap_m=0.1         ; gap between left and right HUD parts (smaller = closer to the middle)
; hud_height_m=0        ; move the HUD up (+) or down (-), meters
; grip_pitch_deg=0      ; weapon grip pitch relative to the controller aim ray
; flip_controllers=-1   ; -1 auto (Quest 2/Pro/Pico), 0 off, 1 on
; sync_wait_ms=20       ; max wait for a new head pose per frame (pacing)
; block_keyboard=1      ; ignore WinlatorXR's emulated keyboard while in VR
; shadow_quality=0      ; 0 blob shadows (fast), 1-5 shadow maps, -1 keep game setting
; mesh_lighting=1       ; 0 ambient, 1 vertex (fast), 2 per-pixel, -1 keep game setting
; lod_scale=1.0         ; model detail distance (Alpine default 10), -1 keep game setting
; big_hud=1             ; 1 big HUD, 0 normal HUD, -1 keep game setting
; crosshair=0           ; 1 green aim dot where the gun points, 0 off
; menu_2d=1             ; 1 menus on the sharp WinlatorXR 2D screen, 0 menus inside VR
; screen_width_m=2.4     ; pause menu / sniper scope screen width (meters)
; screen_distance_m=1.6  ; pause menu / sniper scope screen distance (meters)
; cpu_affinity=-1       ; -1 run the game on the fastest CPU cores, 0 off (applies at game start)
; weapon_scale=0.75     ; size of the gun in your hand (1.0 = model size, 0.2 - 2.0)
; weapon_scale_9=0.75   ; size of one weapon only (number = weapon id, see the log line "Weapon N uses")
